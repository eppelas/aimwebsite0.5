<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="automation-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="automation-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.6"/>
    </filter>
  </defs>

  <g opacity="0.22">
    <path d="M0 18 H100 M0 38 H100 M0 58 H100 M0 78 H100" stroke="#d8ff90" stroke-width="0.24"/>
    <path d="M12 0 V100 M32 0 V100 M52 0 V100 M72 0 V100 M92 0 V100" stroke="#d8ff90" stroke-width="0.24"/>
  </g>

  <ellipse cx="28" cy="58" rx="16" ry="16" fill="#beff6e" opacity="0.12" filter="url(#automation-soft)">
    <animate attributeName="opacity" values="0.12;0.2;0.12;0.12" keyTimes="0;0.56;0.8;1" dur="3.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="71" cy="41" rx="18" ry="16" fill="#ddffab" opacity="0.1" filter="url(#automation-soft)">
    <animate attributeName="opacity" values="0.1;0.16;0.1;0.1" keyTimes="0;0.52;0.78;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="9" y="7" width="33" height="10" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="0.55"/>
  <text x="14" y="13" fill="#f1f6e8" opacity="0.78" font-size="3.1" letter-spacing="1.16" font-family="IBM Plex Mono, monospace">FLOW STACK</text>

  <g filter="url(#automation-glow)" fill="none" stroke="#dfff9d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 48 H34 L44 38 H58 L67 48 H84" stroke-width="1.95">
      <animate attributeName="d" values="M18 48 H34 L44 38 H58 L67 48 H84;M16 50 H32 L45 35 H60 L70 50 H86;M18 48 H34 L44 38 H58 L67 48 H84;M18 48 H34 L44 38 H58 L67 48 H84" keyTimes="0;0.54;0.78;1" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <rect x="22" y="43" width="10" height="10" rx="2.5" stroke-width="1.45"/>
    <rect x="47" y="33" width="10" height="10" rx="2.5" stroke-width="1.45"/>
    <rect x="71" y="43" width="10" height="10" rx="2.5" stroke-width="1.45"/>
    <path d="M52 43 V67" stroke-width="1.45" opacity="0.84"/>
    <path d="M52 67 H74" stroke-width="1.45" opacity="0.84"/>
    <path d="M52 67 H29" stroke-width="1.2" opacity="0.64" stroke-dasharray="2.2 3">
      <animate attributeName="stroke-dashoffset" values="0;-10;-10;0" keyTimes="0;0.45;0.8;1" dur="2.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#automation-glow)" fill="#f0ffc0">
    <circle cx="18" cy="48" r="2.05">
      <animate attributeName="cx" values="18;34;58;84;84" keyTimes="0;0.18;0.52;0.76;1" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="48;48;38;48;48" keyTimes="0;0.18;0.52;0.76;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="43" r="1.9">
      <animate attributeName="cy" values="43;67;67;43" keyTimes="0;0.45;0.76;1" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="52;52;74;52" keyTimes="0;0.45;0.76;1" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="67" r="1.75">
      <animate attributeName="cx" values="52;29;52;52" keyTimes="0;0.52;0.8;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="17" y="82.5" fill="rgba(255,255,255,0.42)" font-size="3.55" letter-spacing="1.05" font-family="IBM Plex Mono, monospace">TRIGGER / ROUTE / UPDATE</text>
</svg>
