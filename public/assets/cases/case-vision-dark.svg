  <g filter="url(#vision-glow)" fill="none" stroke="#e5ffad" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 26 H78 V54 L64 68 H36 Z" stroke-width="2.05">
      <animate attributeName="d" values="M36 26 H78 V54 L64 68 H36 Z;M33 24 H80 V56 L62 72 H33 Z;M36 26 H78 V54 L64 68 H36 Z;M36 26 H78 V54 L64 68 H36 Z" keyTimes="0;0.52;0.76;1" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M44 33 H69" stroke-width="1.8"/>
    <path d="M44 40 H64" stroke-width="1.55" opacity="0.95"/>
    <path d="M44 47 H58" stroke-width="1.55" opacity="0.84"/>
