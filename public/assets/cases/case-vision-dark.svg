<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vision-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.45" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="vision-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.6"/>
    </filter>
  </defs>

  <g opacity="0.22">
    <path d="M0 18 H100 M0 38 H100 M0 58 H100 M0 78 H100" stroke="#d8ff90" stroke-width="0.24"/>
    <path d="M12 0 V100 M32 0 V100 M52 0 V100 M72 0 V100 M92 0 V100" stroke="#d8ff90" stroke-width="0.24"/>
  </g>

  <ellipse cx="66" cy="56" rx="20" ry="17" fill="#cfff84" opacity="0.14" filter="url(#vision-soft)">
    <animate attributeName="opacity" values="0.14;0.08;0.14;0.14" keyTimes="0;0.52;0.76;1" dur="3.7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="26" cy="28" rx="14" ry="11" fill="#dfffaa" opacity="0.1" filter="url(#vision-soft)">
