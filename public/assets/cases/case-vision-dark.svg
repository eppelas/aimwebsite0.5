    </path>
    <path d="M18 70 H36" stroke-width="1.35" opacity="0.72" stroke-dasharray="2.2 3.2">
      <animate attributeName="stroke-dashoffset" values="0;-10;-10;0" keyTimes="0;0.48;0.82;1" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#vision-glow)" fill="#f1ffc7">
