<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>S.K.Y.ai — inkField (interactive)</title>
<style>
  :root{
    --bg:#f4f3ee;
    --ink:#006a4e;
    --ink-2:#1aa37a;
    --ink-3:#2dd39a;
    --ui:#2a2a2a;
    --ui-dim:#8a8a8a;
    --accent:#d94f2a;
    --vector:#1f6feb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:var(--ui);
  }
  .stage{
    position:fixed; inset:0;
    display:grid; place-items:center;
  }
  .frame{
    position:relative;
    width: min(100vw, calc(100vh * 2));
    aspect-ratio: 2 / 1;
    background:
      radial-gradient(ellipse at 30% 40%, #ffffff 0%, transparent 70%),
      var(--bg);
    overflow:hidden;
    border: 1px solid rgba(0,0,0,.06);
    cursor: none;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%;}
  .log, .bboxes, .vectors, .annotations, .title, .statusbar, .cursor, .hint{
    position:absolute; pointer-events:none;
  }
  .log{
    top:2.2%; left:2.2%; right:40%;
    font-size: clamp(8px, .78vw, 12px);
    line-height:1.55;
    color:var(--ui);
    white-space:nowrap;
  }
  .log .row{
    display:flex; gap:.6em; align-items:baseline;
    opacity:0;
    transform: translateY(-3px);
    animation: logIn .4s ease-out forwards;
  }
  .log .t{color:var(--ui-dim)}
  .log .arr{color:var(--ink-2); font-weight:600}
  .log .k{color:var(--ui)}
  .log .v{color:var(--ink); font-weight:600}
  .log .p{color:var(--ui-dim)}
  @keyframes logIn{to{opacity:1; transform:translateY(0)}}

  .bboxes svg, .vectors svg, .annotations svg{
    width:100%; height:100%; position:absolute; inset:0;
  }

  .title{
    left:2.2%; bottom:3.2%;
    color:#111;
  }
  .title .upcoming{
    font-size: clamp(9px, .72vw, 11px);
    color:var(--ink);
    letter-spacing:.02em;
    margin-bottom:.4em;
    opacity:.8;
  }
  .title h1{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(22px, 2.4vw, 42px);
    line-height:1;
    color:#0f0f0f;
    letter-spacing:-.01em;
  }
  .title h2{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(22px, 2.4vw, 42px);
    line-height:1;
    color:var(--ink);
    letter-spacing:-.01em;
    margin-top:.05em;
  }

  .statusbar{
    bottom:1%; left:2.2%;
    font-size: clamp(7px, .62vw, 10px);
    color:var(--ui-dim);
    letter-spacing:.12em;
  }
  .statusbar .rec{
    display:inline-block; width:.6em; height:.6em;
    background:var(--accent); border-radius:50%;
    margin-right:.5em; vertical-align:middle;
    animation: rec 1.2s ease-in-out infinite;
  }
  @keyframes rec{ 0%,100%{opacity:1} 50%{opacity:.3} }

  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(0,106,78,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,106,78,.06) 1px, transparent 1px);
    background-size: 5% 10%;
    pointer-events:none;
    mix-blend-mode: multiply;
  }

  .crop{
    position:absolute;
    width:14px; height:14px;
    border-color:var(--ui);
    border-style:solid;
  }
  .crop.tl{top:1%;  left:1%;  border-width:1px 0 0 1px;}
  .crop.tr{top:1%;  right:1%; border-width:1px 1px 0 0;}
  .crop.bl{bottom:1%; left:1%;  border-width:0 0 1px 1px;}
  .crop.br{bottom:1%; right:1%; border-width:0 1px 1px 0;}

  .legend{
    position:absolute;
    right:2.2%; top:2.2%;
    font-size: clamp(7px, .6vw, 10px);
    color:var(--ui);
    border:1px solid rgba(0,0,0,.15);
    padding:.5em .7em;
    background:rgba(255,255,255,.55);
    backdrop-filter: blur(2px);
    line-height:1.6;
    letter-spacing:.02em;
    min-width:160px;
  }
  .legend .row{display:flex; justify-content:space-between; gap:.8em}
  .legend .sw{
    display:inline-block; width:.9em; height:.9em;
    vertical-align:middle; margin-right:.4em;
    border:1px solid rgba(0,0,0,.2);
  }
  .legend .val{color:var(--ink); font-weight:600}
  .legend hr{border:none; border-top:1px dashed rgba(0,0,0,.15); margin:.35em 0}

  /* custom cursor */
  .cursor{
    top:0; left:0;
    width:32px; height:32px;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .cursor svg{ width:100%; height:100%; overflow:visible }

  .hint{
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    font-size: clamp(10px, .9vw, 14px);
    color: var(--ui-dim);
    letter-spacing:.3em;
    text-transform:uppercase;
    text-align:center;
    transition: opacity .6s ease;
  }
  .hint.hidden{ opacity:0 }
  .hint small{
    display:block;
    font-size:.7em;
    letter-spacing:.2em;
    margin-top:.8em;
    color:var(--ui-dim);
    opacity:.7;
  }
  .hint .dot{
    display:inline-block;
    width:6px; height:6px;
    background:var(--ink);
    border-radius:50%;
    margin:0 .6em;
    vertical-align:middle;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame" id="frame">
      <div class="grid"></div>
      <canvas id="ink"></canvas>
      <div class="vectors"><svg id="svgVectors" viewBox="0 0 2000 1000" preserveAspectRatio="none"></svg></div>
      <div class="bboxes"><svg id="svgBbox" viewBox="0 0 2000 1000" preserveAspectRatio="none"></svg></div>
      <div class="annotations"><svg id="svgAnno" viewBox="0 0 2000 1000" preserveAspectRatio="none"></svg></div>

      <div class="log" id="log"></div>

      <div class="legend">
        <div class="row"><span><span class="sw" style="background:#006a4e"></span>ink</span><span class="val" id="lgStrokes">0</span></div>
        <div class="row"><span><span class="sw" style="background:#1aa37a"></span>mid</span><span class="val" id="lgParticles">0</span></div>
        <div class="row"><span><span class="sw" style="background:#2dd39a"></span>accent</span><span class="val" id="lgFps">0</span></div>
        <hr/>
        <div class="row"><span>velocity</span><span class="val" id="lgVel">0.00</span></div>
        <div class="row"><span>pressure</span><span class="val" id="lgPress">0.00</span></div>
        <div class="row"><span>cursor</span><span class="val" id="lgPos">0,0</span></div>
      </div>

      <div class="crop tl"></div>
      <div class="crop tr"></div>
      <div class="crop bl"></div>
      <div class="crop br"></div>

      <div class="title">
        <div class="upcoming">Upcoming — details soon</div>
        <h1>S.K.Y.ai</h1>
        <h2>inkField</h2>
      </div>

      <div class="statusbar">
        <span class="rec"></span><span id="tc">00:00:00:00</span> &nbsp; / &nbsp; <span id="fi">F 1</span> &nbsp; / &nbsp; INTERACTIVE
      </div>

      <!-- hint overlay -->
      <div class="hint" id="hint">
        move cursor<span class="dot"></span>draw ink
        <small>hold to press · release to lift</small>
      </div>

      <!-- custom cursor -->
      <div class="cursor" id="cursor">
        <svg viewBox="-16 -16 32 32">
          <circle cx="0" cy="0" r="10" fill="none" stroke="#006a4e" stroke-width="1" stroke-dasharray="3 2"/>
          <circle cx="0" cy="0" r="2" fill="#d94f2a"/>
          <line x1="-16" y1="0" x2="-12" y2="0" stroke="#006a4e" stroke-width="1"/>
          <line x1="12"  y1="0" x2="16"  y2="0" stroke="#006a4e" stroke-width="1"/>
          <line x1="0" y1="-16" x2="0" y2="-12" stroke="#006a4e" stroke-width="1"/>
          <line x1="0" y1="12"  x2="0" y2="16"  stroke="#006a4e" stroke-width="1"/>
        </svg>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');
  const tcEl = document.getElementById('tc');
  const fiEl = document.getElementById('fi');
  const cursor = document.getElementById('cursor');
  const hint = document.getElementById('hint');

  const svgVec = document.getElementById('svgVectors');
  const svgBox = document.getElementById('svgBbox');
  const svgAnn = document.getElementById('svgAnno');
  const logEl = document.getElementById('log');

  const lgStrokes = document.getElementById('lgStrokes');
  const lgParticles = document.getElementById('lgParticles');
  const lgFps = document.getElementById('lgFps');
  const lgVel = document.getElementById('lgVel');
  const lgPress = document.getElementById('lgPress');
  const lgPos = document.getElementById('lgPos');

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const VW = 2000, VH = 1000;

  function resize(){
    const r = frame.getBoundingClientRect();
    canvas.width  = Math.round(r.width  * DPR);
    canvas.height = Math.round(r.height * DPR);
    canvas.style.width  = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // palette rotator — each new stroke picks next color
  const palette = [
    'rgba(0,90,64,1)',
    'rgba(0,120,84,1)',
    'rgba(26,163,122,1)',
    'rgba(0,140,96,1)',
    'rgba(45,211,154,.9)',
  ];
  let strokeColorIdx = 0;

  // ---- STATE -----------------------------------------------------------
  const splats = [];
  let mouseInside = false;
  let pointerDown = false;
  let mouse = {x: VW/2, y: VH/2, px: VW/2, py: VH/2, vx:0, vy:0, v:0};
  let lastMoveT = 0;
  let currentStroke = null;   // {id, color, points:[{x,y}], bbox:{x,y,w,h}, node, labelNode, tStart, tEnd}
  const strokes = [];         // completed strokes for bbox/vector trail
  const MAX_TRAIL = 8;

  // hint hide
  let firstMove = false;

  // ---- INPUT -----------------------------------------------------------
  function frameCoords(e){
    const r = frame.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  * VW;
    const y = (e.clientY - r.top ) / r.height * VH;
    return {x, y};
  }

  frame.addEventListener('pointermove', (e) => {
    const p = frameCoords(e);
    const now = performance.now();
    const dt = Math.max(1, now - lastMoveT);
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = p.x; mouse.y = p.y;
    mouse.vx = (mouse.x - mouse.px) / dt * 16;  // per ~frame
    mouse.vy = (mouse.y - mouse.py) / dt * 16;
    mouse.v  = Math.hypot(mouse.vx, mouse.vy);
    lastMoveT = now;
    mouseInside = true;
    // move custom cursor (CSS-space coords)
    const r = frame.getBoundingClientRect();
    const cx = p.x / VW * r.width;
    const cy = p.y / VH * r.height;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%)`;
    cursor.style.opacity = 1;

    if(!firstMove){ firstMove = true; hint.classList.add('hidden'); }

    // if no stroke yet, start one on first move
    if(!currentStroke) beginStroke();
    else addPointToStroke();
  });

  frame.addEventListener('pointerdown', (e) => {
    pointerDown = true;
    // cycle color on each press for variety
    strokeColorIdx = (strokeColorIdx + 1) % palette.length;
    if(!currentStroke) beginStroke();
  });
  frame.addEventListener('pointerup', () => { pointerDown = false; });
  frame.addEventListener('pointerleave', () => {
    mouseInside = false;
    cursor.style.opacity = 0;
    endStroke();
  });
  frame.addEventListener('pointerenter', () => {
    mouseInside = true;
    cursor.style.opacity = 1;
  });

  // double-click clears canvas
  frame.addEventListener('dblclick', () => {
    splats.length = 0;
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.restore();
    for(const s of strokes){
      if(s.bboxNode) s.bboxNode.remove();
      if(s.labelNode) s.labelNode.remove();
      if(s.vecNode) s.vecNode.remove();
    }
    strokes.length = 0;
    logEl.innerHTML = '';
    pushLog('[sys]','Canvas cleared',{trigger:'dblclick'});
  });

  // ---- STROKES ---------------------------------------------------------
  const svgNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(svgNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function beginStroke(){
    const id = Math.floor(Math.random()*9000+1000);
    const color = palette[strokeColorIdx];
    currentStroke = {
      id, color,
      points: [{x: mouse.x, y: mouse.y, t: performance.now(), v: 0}],
      bbox: {x:mouse.x, y:mouse.y, w:0, h:0},
      bboxNode: null, labelNode: null, vecNode: null,
      seed: Math.floor(Math.random()*1e9),
    };
    pushLog('[trk]', 'New stroke started', {
      Seed: String(currentStroke.seed),
      Mode: 'Brush mode ' + (1 + (strokeColorIdx%3)),
      Position: `[${Math.round(mouse.x)},${Math.round(mouse.y)}]`,
    });
  }

  function addPointToStroke(){
    if(!currentStroke) return;
    const s = currentStroke;
    const last = s.points[s.points.length-1];
    const dx = mouse.x - last.x, dy = mouse.y - last.y;
    const d = Math.hypot(dx, dy);
    if(d < 3) return; // resample
    s.points.push({x: mouse.x, y: mouse.y, t: performance.now(), v: mouse.v});
    // update bbox
    const b = s.bbox;
    const x0 = Math.min(b.x, mouse.x);
    const y0 = Math.min(b.y, mouse.y);
    const x1 = Math.max(b.x + b.w, mouse.x);
    const y1 = Math.max(b.y + b.h, mouse.y);
    b.x = x0; b.y = y0; b.w = x1-x0; b.h = y1-y0;

    // update or create SVG bbox
    const pad = 30 + (pointerDown ? 30 : 0);
    if(!s.bboxNode){
      s.bboxNode = el('rect',{
        x: b.x-pad, y: b.y-pad, width: b.w+pad*2, height: b.h+pad*2,
        fill:'none', stroke:'rgba(31,111,235,.55)', 'stroke-width':'1',
        'stroke-dasharray':'6 4',
      });
      svgBox.appendChild(s.bboxNode);
      s.labelNode = el('text',{
        x: b.x-pad+4, y: b.y-pad-4,
        'font-family':'ui-monospace, monospace', 'font-size':'10',
        fill:'rgba(31,111,235,.85)',
      });
      s.labelNode.textContent = `stroke_${s.id}`;
      svgBox.appendChild(s.labelNode);
      s.vecNode = el('polyline',{
        points:'',
        fill:'none', stroke:'rgba(31,111,235,.35)', 'stroke-width':'1',
        'stroke-dasharray':'4 3',
      });
      svgVec.appendChild(s.vecNode);
    }else{
      s.bboxNode.setAttribute('x', b.x-pad);
      s.bboxNode.setAttribute('y', b.y-pad);
      s.bboxNode.setAttribute('width',  b.w+pad*2);
      s.bboxNode.setAttribute('height', b.h+pad*2);
      s.labelNode.setAttribute('x', b.x-pad+4);
      s.labelNode.setAttribute('y', b.y-pad-4);
    }
    // update vector polyline (simplified — every 3rd pt)
    const simp = s.points.filter((_,i)=>i%3===0);
    s.vecNode.setAttribute('points', simp.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '));

    // emit particles for the new segment
    emitSegment(last.x, last.y, mouse.x, mouse.y, mouse.v, s.color);
  }

  function endStroke(){
    if(!currentStroke) return;
    const s = currentStroke;
    strokes.push(s);
    pushLog('[trk]', 'Stroke ended', {
      id: String(s.id),
      points: String(s.points.length),
      particles: String(splats.length),
    });
    // fade out bbox of oldest strokes
    while(strokes.length > MAX_TRAIL){
      const old = strokes.shift();
      fadeAndRemove(old.bboxNode);
      fadeAndRemove(old.labelNode);
      fadeAndRemove(old.vecNode);
    }
    currentStroke = null;
  }

  function fadeAndRemove(node){
    if(!node) return;
    node.style.transition = 'opacity 1.2s ease';
    node.style.opacity = '0';
    setTimeout(()=>node.remove(), 1300);
  }

  // ---- PARTICLES -------------------------------------------------------
  function emitSegment(x0,y0,x1,y1,v,color){
    const dx = x1-x0, dy = y1-y0;
    const d = Math.hypot(dx,dy);
    if(d < 0.1) return;
    // pressure: pointerDown boosts, velocity boosts, with cap
    const press = pointerDown ? 1 : 0.55;
    const vNorm = Math.min(1, v / 60);
    const width = (25 + vNorm * 90 + press*40);
    const density = Math.ceil(d * (0.8 + press*1.2));
    for(let i=0;i<density;i++){
      const u = i/density;
      const px = x0 + dx*u;
      const py = y0 + dy*u;
      // cluster
      const cluster = 4 + Math.floor(Math.random()*6 + press*4);
      for(let c=0;c<cluster;c++){
        const ang = Math.random()*Math.PI*2;
        const dist = Math.pow(Math.random(),.6) * width * (0.4 + Math.random()*0.9);
        splats.push({
          x: px + Math.cos(ang)*dist,
          y: py + Math.sin(ang)*dist,
          r: (0.6 + Math.random()*2.6) * (0.7 + press*0.5),
          a: 0.18 + Math.random()*0.55 * (0.6 + press*0.4),
          color,
          vx: (Math.random()-0.5)*0.4 + dx/d*0.4,
          vy: (Math.random()-0.5)*0.4 + dy/d*0.4 + 0.05,
        });
      }
      // heavy core
      if(Math.random() < 0.4 + press*0.3){
        splats.push({
          x: px + (Math.random()-0.5)*width*0.2,
          y: py + (Math.random()-0.5)*width*0.2,
          r: (2.5 + Math.random()*4 + press*2),
          a: 0.55 + Math.random()*0.3,
          color, vx:0, vy:0,
        });
      }
    }
    if(splats.length > 24000) splats.splice(0, splats.length - 24000);
  }

  function applyAlpha(color, a){
    return color.replace(/rgba?\(([^)]+)\)/, (_,inside) => {
      const parts = inside.split(',').map(x=>x.trim());
      const base = parts.slice(0,3).join(',');
      const baseA = parts[3] !== undefined ? parseFloat(parts[3]) : 1;
      return `rgba(${base},${(a*baseA).toFixed(3)})`;
    });
  }

  function drawSplats(){
    const scaleX = canvas.clientWidth  / VW;
    const scaleY = canvas.clientHeight / VH;
    ctx.save();
    ctx.scale(scaleX, scaleY);
    for(let i=0;i<splats.length;i++){
      const s = splats[i];
      s.x += s.vx; s.y += s.vy;
      ctx.beginPath();
      ctx.fillStyle = applyAlpha(s.color, s.a);
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // slight fade per frame — subtle "wetness"
  function fadeFrame(){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = 'rgba(244,243,238,0.03)';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.restore();
  }

  // ---- LOG -------------------------------------------------------------
  function pushLog(tag, msg, kv){
    const d = new Date();
    const t = `[${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}]`;
    const row = document.createElement('div');
    row.className = 'row';
    let kvStr = '';
    for(const k in kv){
      kvStr += ` <span class="k">${k}</span><span class="p">:</span><span class="v">"${kv[k]}"</span><span class="p">,</span>`;
    }
    kvStr = kvStr.replace(/,$/, '');
    row.innerHTML = `<span class="t">${t}</span><span class="arr">→</span><span>${msg}</span><span class="p">{</span>${kvStr}<span class="p">}</span>`;
    logEl.appendChild(row);
    while(logEl.children.length > 12) logEl.removeChild(logEl.firstChild);
  }

  // preload logs
  pushLog('[sys]','Reference image size updated',{Width:'2000px', Height:'1000px'});
  pushLog('[sys]','Playback environment ready',{Status:'All systems initialized'});
  pushLog('[sys]','Interactive mode',{Controls:'move = draw · press = heavy · dblclick = clear'});

  // periodic heartbeat log
  setInterval(()=>{
    pushLog('[hbt]','inkField composite',{
      strokes: String(strokes.length + (currentStroke?1:0)),
      particles: String(splats.length),
      fps: String(fps|0),
      velocity: mouse.v.toFixed(2),
    });
  }, 2200);

  // ---- MAIN LOOP -------------------------------------------------------
  const startTime = performance.now();
  let lastFrame = startTime;
  let fps = 60;
  let fi = 0;

  function fmtTC(sec){
    const h = Math.floor(sec/3600) % 100;
    const m = Math.floor(sec/60) % 60;
    const s = Math.floor(sec) % 60;
    const f = Math.floor((sec%1)*24);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(h)}:${pad(m)}:${pad(s)}:${pad(f)}`;
  }

  function loop(now){
    const dt = now - lastFrame;
    lastFrame = now;
    fps = fps*0.9 + (1000/Math.max(1,dt))*0.1;

    // velocity decay if no motion
    const sinceMove = now - lastMoveT;
    if(sinceMove > 40){
      mouse.vx *= 0.9; mouse.vy *= 0.9;
      mouse.v = Math.hypot(mouse.vx, mouse.vy);
    }
    // idle too long -> end stroke
    if(currentStroke && sinceMove > 180 && !pointerDown){
      endStroke();
    }

    fadeFrame();
    drawSplats();

    tcEl.textContent = fmtTC((now-startTime)/1000);
    fiEl.textContent = 'F ' + (++fi);

    lgStrokes.textContent = strokes.length + (currentStroke?1:0);
    lgParticles.textContent = splats.length;
    lgFps.textContent = Math.round(fps);
    lgVel.textContent = mouse.v.toFixed(2);
    lgPress.textContent = (pointerDown?1:0.55).toFixed(2);
    lgPos.textContent = `${Math.round(mouse.x)},${Math.round(mouse.y)}`;

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
